# Aperçu à la demande : fabrique UNE vidéo à partir d'un script, sans toucher à la production ni aux plateformes.
# Le résultat (MP4 + miniature) est joint à la pré-version « apercu » du dépôt (onglet Releases).
name: preview

on:
  workflow_dispatch:
    inputs:
      script:
        description: "script JSON à prévisualiser"
        default: backlog/pilot/01-science-pieuvre.json

permissions:
  contents: write          # joindre la vidéo à la pré-version « apercu »

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng fonts-inter
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: piper-fr_FR-siwis-medium-v1
      - run: |
          if [ ! -f models/fr_FR-siwis-medium.onnx ]; then
            python -m piper.download_voices fr_FR-siwis-medium --download-dir models || true
          fi
      - name: Fabriquer l'aperçu
        run: |
          # sans jeton Replicate : images IA d'aperçu via le service gratuit pollinations (même famille FLUX)
          [ -z "$REPLICATE_API_TOKEN" ] && export STUDIO_AI_BACKEND=pollinations
          mkdir -p apercu
          set -o pipefail
          python -m studio preview "${{ inputs.script }}" --out apercu 2>&1 | tee apercu/journal-apercu.txt
      - name: Joindre à la pré-version « apercu »
        if: always()
        run: |
          gh release view apercu >/dev/null 2>&1 || gh release create apercu --prerelease --title "Aperçus vidéo" --notes "Vidéos d'aperçu (non publiées)."
          gh release upload apercu apercu/* --clobber
