    risk: low
  - id: afrique
    label: "Afrique"
    name: "Afrique méconnue (géographie & patrimoine)"
    audience: "15-45 ans, diaspora et Afrique francophone"
    palette: ["#3B1F0B", "#D35400", "#F9D56E"]
    hashtags: ["#afrique", "#geographie", "#patrimoine", "#culture"]
