  - id: quiz
    label: "Quiz"
    name: "Quiz & énigmes"
    audience: "10-35 ans, jeux de logique"
    palette: ["#1B1B3A", "#F39C12", "#FFE29A"]
    hashtags: ["#quiz", "#enigme", "#logique", "#defi"]
