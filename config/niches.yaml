# Les 10 niches du pilote (justification complète : docs/RESEARCH.md §5).
# priority : poids initial de sélection (le stratège le réajuste selon les performances).
# risk : niveau de risque de désinformation => sévérité du contrôle qualité.
niches:
  - id: science
    label: "Science"
    name: "Science étonnante"
    audience: "15-35 ans curieux, francophones"
    palette: ["#0B1D3A", "#1F6FEB", "#7CC4FF"]
    hashtags: ["#science", "#lesaviezvous", "#apprendresurtiktok", "#culturegenerale"]
    priority: 1.0
    risk: medium
  - id: histoire
    label: "Histoire"
    name: "Histoire express"
    audience: "18-45 ans, amateurs d'anecdotes"
    palette: ["#2B1B0E", "#B5651D", "#F2C14E"]
    hashtags: ["#histoire", "#anecdote", "#culture", "#lesaviezvous"]
    priority: 1.0
    risk: medium
  - id: espace
    label: "Espace"
    name: "Mystères de l'espace"
    audience: "13-35 ans, passionnés d'astronomie"
    palette: ["#05010F", "#4B2A8C", "#C9A7FF"]
    hashtags: ["#espace", "#astronomie", "#univers", "#science"]
    priority: 1.0
    risk: low
  - id: finance
    label: "Argent malin"
    name: "Argent malin (finance personnelle pédagogique)"
    audience: "18-35 ans, premiers salaires, Afrique francophone et Europe"
