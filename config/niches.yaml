    hashtags: ["#financepersonnelle", "#epargne", "#budget", "#argent"]
    priority: 0.9
    risk: high          # jamais de conseil d'investissement personnalisé
  - id: tech_ia
    label: "Tech & IA"
    name: "Tech & IA utiles"
    audience: "16-40 ans, étudiants et actifs"
    palette: ["#0D0D0D", "#00A884", "#7CF3D0"]
    hashtags: ["#ia", "#tech", "#astuce", "#productivite"]
    priority: 1.0
    risk: medium
  - id: psycho
    label: "Psycho"
    name: "Psychologie & biais cognitifs"
    audience: "18-40 ans, développement personnel"
    palette: ["#2A0E2E", "#9B3D8F", "#F5B7E8"]
    hashtags: ["#psychologie", "#biaiscognitifs", "#cerveau", "#mental"]
    priority: 0.9
    risk: medium
  - id: langues
    label: "Anglais"
    name: "Anglais en 30 secondes"
